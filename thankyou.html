<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ขอบคุณที่สั่งซื้อ — Body Scent</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Page-specific styles for the thank-you page */
    .thanks {
      min-height: calc(100vh - 4.5rem);
      min-height: calc(100svh - 4.5rem);
      display: flex;
      align-items: center;
      padding: var(--space-5) 0;
      background: linear-gradient(to bottom, var(--cream), var(--ivory));
    }

    .thanks h1 {
      font-size: clamp(2rem, 5vw, 3rem);
    }

    .thanks p {
      margin-bottom: var(--space-4);
    }

    @media (max-width: 480px) {
      .thanks {
        min-height: auto;
        padding: var(--space-6) 0;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="thanks">
      <div class="container text-center">
        <h1>ขอบคุณที่สั่งซื้อ</h1>
        <p>เราได้รับคำสั่งซื้อของคุณแล้ว ขอบคุณที่เลือก Body Scent</p>
        <a class="btn" href="index.html">กลับหน้าแรก</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Body Scent — เติมกลิ่นหอมที่ใช่ ให้ตรงกับทุกความรู้สึกในแบบของคุณ</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
