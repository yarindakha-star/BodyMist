<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รายการสั่งซื้อ — Body Scent</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Page-specific styles for the admin page */
    .page-title {
      font-size: clamp(2rem, 5vw, 3rem);
    }

    .page-head {
      padding: var(--space-5) 0 var(--space-4);
      background: linear-gradient(to bottom, var(--cream), var(--ivory));
    }

    .page-head p {
      margin-bottom: 0;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
    }

    #ordersTable {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    #ordersTable th,
    #ordersTable td {
      padding: 0.9rem 1rem;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line-soft);
    }

    #ordersTable th {
      font-weight: 400;
      color: var(--ink);
      white-space: nowrap;
      background: var(--cream);
      border-bottom: 1px solid var(--ink);
    }

    #ordersTable td {
      color: var(--ink-soft);
    }

    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-head">
      <div class="container">
        <h1 class="page-title">รายการสั่งซื้อ</h1>
        <p>รายการล่าสุดอยู่ด้านบน</p>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
